services:
  - type: web
    name: adparlorr-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:deploy && npm run db:seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Postgres — Session pooler connection string, port 5432.
      # Set manually in Render's dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      # Set manually once the Netlify site exists, e.g. https://your-site.netlify.app
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      # Read once by the seed script to bootstrap one admin account.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SIMULATION_MERGE_THRESHOLD
        value: "15"
      - key: SIMULATION_MIN_WITHDRAWAL_BALANCE
        value: "100"
      - key: SIMULATION_MAX_DEPOSIT_AMOUNT
        value: "100000"
      - key: SIMULATION_WORKBENCH_SET_SIZE
        value: "45"
      # From your Supabase project's Settings -> API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: training-task-images
